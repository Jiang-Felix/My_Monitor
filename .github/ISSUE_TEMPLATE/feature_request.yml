name: 功能建议 / Feature request
description: 描述使用场景和期待的结果。
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 描述具体场景，不上传账户资料。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望的行为 / Desired behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Context
